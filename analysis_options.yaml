# LF Kitchen - Analysis Options
# This file configures the analyzer to enforce linting rules
# and prevent common coding issues.

include: package:flutter_lints/flutter.yaml

analyzer:
  # Treat certain issues as errors to prevent them from being ignored
  errors:
    # Critical issues - treat as errors
    unused_import: error
    
    # Async/BuildContext issues - important but not blocking
    use_build_context_synchronously: warning
    
    # Deprecated APIs - warn about them
    deprecated_member_use: warning
    deprecated_member_use_from_same_package: warning
    
    # Type safety
    invalid_assignment: error
    missing_return: error
    
  # Exclude generated files from analysis
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    - ".dart_tool/**"
    - "test/**"

linter:
  rules:
    # === CRITICAL RULES (Prevent bugs) ===
    # Enforce curly braces in control flow statements
    curly_braces_in_flow_control_structures: true
    
    # Avoid print statements (use debugPrint or logging instead)
    avoid_print: true
    
    # Avoid empty else blocks
    avoid_empty_else: true
    
    # Await only futures
    await_only_futures: true
    
    # === STYLE RULES (Optional - can disable if too strict) ===
    # Prefer single quotes for strings
    prefer_single_quotes: false
    
    # Prefer const constructors (disable jika terlalu banyak warning)
    prefer_const_constructors: false
    prefer_const_declarations: false
    prefer_const_literals_to_create_immutables: false
    
    # Sort imports (disable jika terlalu banyak warning)
    directives_ordering: false
    
    # Prefer final for local variables (disable untuk flexibility)
    prefer_final_locals: false
    
    # === AVOID RULES ===
    # Avoid returning null for Future
    avoid_returning_null_for_future: true
    
    # Avoid unnecessary containers
    avoid_unnecessary_containers: true
    
    # === PREFER RULES ===
    # Use isEmpty/isNotEmpty instead of length checks
    prefer_is_empty: true
    prefer_is_not_empty: true
    
    # Use if-null operators
    prefer_if_null_operators: true
    prefer_null_aware_operators: true
    
    # Use interpolation to compose strings
    prefer_interpolation_to_compose_strings: true
    
    # === TYPE SAFETY ===
    # Always specify types for async functions
    always_declare_return_types: true
    
    # Prefer typing uninitialized variables
    prefer_typing_uninitialized_variables: true
    
    # === NULL SAFETY ===
    # Unnecessary null checks
    unnecessary_null_checks: true

# Additional information:
# - Run `flutter analyze` to check for issues
# - Run `dart fix --apply` to auto-fix some issues
# - IDE will show issues in real-time with these settings
#
# To enable stricter linting later, uncomment the disabled rules above.
